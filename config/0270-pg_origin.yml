#==============================================================#
# 0270 pg_origin
#==============================================================#
# Disabled by default. Provision access before explicitly setting skip: false.
# PG14+ with standard catalog ACLs: run as an administrator in the exporter's
# main connection database, replacing monitor with the actual monitoring role:
# GRANT SELECT ON pg_catalog.pg_replication_origin_status TO monitor;
# GRANT EXECUTE ON FUNCTION pg_catalog.pg_show_replication_origin_status() TO monitor;
# PG13 and older: the function also checks for superuser internally; GRANT alone
# is insufficient. Keep disabled for ordinary monitoring roles.
pg_origin:
  name: pg_origin
  desc: PostgreSQL replay state (approximate) for a certain origin
  query: SELECT roname, remote_lsn - '0/0' AS remote_lsn, local_lsn - '0/0' AS local_lsn FROM pg_replication_origin o LEFT JOIN pg_replication_origin_status os ON o.roident = os.local_id;
  ttl: 10
  min_version: 090500
  skip: true
  tags: [ cluster ]
  metrics:
    - roname:              { usage: LABEL     ,description: "The external, user defined, name of a replication origin." }
    - remote_lsn:          { usage: COUNTER   ,description: "The origin node's LSN up to which data has been replicated." }
    - local_lsn:           { usage: COUNTER   ,description: "This node's LSN at which remote_lsn has been replicated." }


